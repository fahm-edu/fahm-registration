<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تسجيل الطلاب - منصة فهم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#12399c;--blue2:#0b2a78;--gold:#f5b81c;--bg:#f4f7fd;--ink:#14213d;--mut:#5a6785;--line:#d9e1f2;--err:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:#fff;border-bottom:4px solid var(--gold);padding:8px 14px;display:flex;align-items:center;gap:12px;justify-content:space-between}
header img{height:52px;width:auto}header h1{font-size:17px;margin:0;color:var(--blue)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:15px;padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--blue);color:#fff}
.btn.g{background:var(--gold);color:#3b2b00}.btn.s{background:#fff;color:var(--blue);border:2px solid var(--blue)}.btn.d{background:#fff;color:var(--err);border:2px solid var(--err)}
.btn[disabled]{opacity:.5}
.login{max-width:400px;margin:40px auto}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
@media(max-width:700px){.tools{grid-template-columns:1fr 1fr}}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{background:#eaf0ff;color:var(--blue);position:sticky;top:0}
tr.r{cursor:pointer}tr.r:hover{background:#fff8e1}
.st{display:inline-block;padding:2px 10px;border-radius:999px;background:#eaf0ff;color:var(--blue);font-size:13px;font-weight:700;white-space:nowrap}
.er{color:var(--err);font-weight:600}.mut{color:var(--mut);font-size:13px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
.box{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:18px}
.box h2{margin:0 0 8px;color:var(--blue);font-size:19px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}.kv div{padding:3px 0;font-size:14px}.kv b{color:var(--mut);font-weight:600}
.stu{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;font-size:14px}
.hide{display:none!important}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}#print table{min-width:0;font-size:11px}#print h1{font-size:16px}}
</style>
</head>

  const j=await r.json();if(!r.ok||!j.access_token)throw 0;tok=j.access_token;sessionStorage.setItem("fahm_t",tok);$("#pw").value="";await load()}
 catch(_){$("#le").textContent="تعذّر الدخول. تأكد من البريد وكلمة السر."}b.disabled=false}
function logout(){tok="";sessionStorage.removeItem("fahm_t");rows=[];$("#ap").classList.add("hide");$("#lg").classList.remove("hide");$("#out").hidden=true}
async function load(){
 const r=await fetch(SB.url+"/rest/v1/registrations?select=*&order=created_at.desc&limit=2000",{headers:hd()});
 if(r.status===401||r.status===403){logout();$("#le").textContent="انتهت الجلسة. سجّل الدخول مرة أخرى.";return}
 if(!r.ok){alert("تعذّر تحميل الطلبات.");return}
 rows=await r.json();
 if(!Array.isArray(rows)){rows=[];}
 $("#lg").classList.add("hide");$("#ap").classList.remove("hide");$("#out").hidden=false;filters();render()}
function filters(){const fs=$("#fs"),fc=$("#fc"),fg=$("#fg"),v=[fs.value,fc.value,fg.value];
 fs.innerHTML='<option value="">كل الحالات</option>'+Object.entries(ST).map(([k,t])=>`<option value="${k}">${t}</option>`).join("");
 const cs=new Set(),gs=new Set();rows.forEach(r=>(r.students||[]).forEach(s=>{cs.add(svcOf(s));if(s.grade)gs.add(s.grade)}));
 fc.innerHTML='<option value="">كل المناهج والخدمات</option>'+[...cs].sort().map(x=>`<option>${esc(x)}</option>`).join("");
 fg.innerHTML='<option value="">كل الصفوف</option>'+[...gs].sort().map(x=>`<option>${esc(x)}</option>`).join("");
 fs.value=v[0];fc.value=v[1];fg.value=v[2]}
function apply(){const q=$("#q").value.trim().toLowerCase(),s=$("#fs").value,c=$("#fc").value,g=$("#fg").value,a=$("#d1").value,b=$("#d2").value;
 view=rows.filter(r=>{const st=r.students||[];
  if(q&&!(`${r.ref} ${r.parent_name} ${r.phone} ${r.whatsapp} ${st.map(x=>x.name).join(" ")}`.toLowerCase().includes(q)))return false;
  if(s&&r.status!==s)return false;
  if(c&&!st.some(x=>svcOf(x)===c))return false;
  if(g&&!st.some(x=>x.grade===g))return false;
  const d=r.created_at.slice(0,10);if(a&&d<a)return false;if(b&&d>b)return false;return true})}
function render(){apply();$("#cnt").textContent=`عدد الطلبات: ${view.length} من ${rows.length}`;
 $("#tb").innerHTML=view.map((r,i)=>`<tr class="r" data-i="${i}"><td dir="ltr">${esc(r.ref)}</td><td>${esc(fmt(r.created_at))}</td><td>${esc(r.parent_name)}</td><td dir="ltr">${esc(r.phone)}</td><td>${r.student_count}</td><td>${esc((r.students||[]).map(svcOf).join("، "))}</td><td><span class="st">${esc(ST[r.status]||r.status)}</span></td><td>${esc(r.assigned_to)}</td></tr>`).join("")||`<tr><td colspan="8" class="mut">لا توجد طلبات مطابقة.</td></tr>`}
function detail(i){const r=view[i];const wa=String(r.whatsapp||r.phone).replace(/\D/g,"");
 $("#bx").innerHTML=`<h2>طلب <span dir="ltr">${esc(r.ref)}</span></h2><div class="mut">${esc(fmt(r.created_at))}</div>
 <div class="kv"><div><b>ولي الأمر:</b> ${esc(r.parent_name)}</div><div><b>الهاتف:</b> <span dir="ltr">${esc(r.phone)}</span></div><div><b>واتساب:</b> <span dir="ltr">${esc(r.whatsapp)}</span></div><div><b>الدولة المقيم فيها:</b> ${esc(r.country)}</div><div><b>المدينة:</b> ${esc(r.city)}</div><div><b>البريد:</b> ${esc(r.email)}</div></div>
 ${r.parent_notes?`<div><b>ملاحظات ولي الأمر:</b> ${esc(r.parent_notes)}</div>`:""}
 ${(r.students||[]).map((s,k)=>`<div class="stu"><b>الطالب ${k+1}: ${esc(s.name)}</b> — ${esc(s.age)} سنة${s.gender?" — "+esc(s.gender):""}<br>الإقامة: ${esc(s.country)} / ${esc(s.city)}<br>الخدمة: ${esc(s.service)}${s.program?" - "+esc(s.program):""}${s.level?" ("+esc(s.level)+")":""}
 ${s.curriculum?`<br>المنهج: ${esc(s.curriculum)} — ${esc(s.stage)} — ${esc(s.grade)} — ${esc(s.year)} — ${esc(s.term)}<br>مسجل في مدرسة: ${esc(s.enrolled)}${s.school?" — "+esc(s.school)+" ("+esc(s.school_country)+")":""}`:""}
 ${(s.extras||[]).length?`<br>الخدمات الإضافية: ${esc(s.extras.join("، "))}`:""}${s.note?`<br>ملاحظات: ${esc(s.note)}`:""}</div>`).join("")}
 <label>حالة الطلب<select id="e_st">${Object.entries(ST).map(([k,t])=>`<option value="${k}" ${k===r.status?"selected":""}>${t}</option>`).join("")}</select></label>
 <label>الموظف المسؤول<input id="e_as" value="${esc(r.assigned_to)}" maxlength="80"></label>
 <label>ملاحظة داخلية<textarea id="e_nt" rows="3" maxlength="1000">${esc(r.admin_note)}</textarea></label>
 <div class="act"><button class="btn" data-a="save" data-id="${r.id}">حفظ التعديلات</button><a class="btn g" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${wa}">فتح محادثة واتساب مع ولي الأمر</a><button class="btn s" data-a="close">إغلاق</button><button class="btn d" data-a="del" data-id="${r.id}">حذف الطلب</button></div>`;
 $("#md").classList.remove("hide")}
async function save(id){const body={status:$("#e_st").value,assigned_to:$("#e_as").value.slice(0,80),admin_note:$("#e_nt").value.slice(0,1000)};
 const r=await fetch(`${SB.url}/rest/v1/registrations?id=eq.${encodeURIComponent(id)}`,{method:"PATCH",headers:{...hd(),Prefer:"return=minimal"},body:JSON.stringify(body)});
 if(!r.ok){alert("تعذّر حفظ التعديل.");return}$("#md").classList.add("hide");await load()}
async function del(id){if(!confirm("حذف هذا الطلب نهائيًا؟"))return;
 const r=await fetch(`${SB.url}/rest/v1/registrations?id=eq.${encodeURIComponent(id)}`,{method:"DELETE",headers:hd()});
 if(!r.ok){alert("تعذّر الحذف.");return}$("#md").classList.add("hide");await load()}

function sheets(){const A=[["رقم الطلب","التاريخ","ولي الأمر","الهاتف","واتساب","الدولة","المدينة","البريد","عدد الطلاب","الحالة","الموظف المسؤول","ملاحظات ولي الأمر","ملاحظة داخلية"]],B=[["رقم الطلب","ولي الأمر","الطالب","العمر","تاريخ الميلاد","الجنس","الدولة","المدينة","الخدمة","البرنامج","المستوى","المنهج","المرحلة","الصف","السنة","الفصل","مسجل في مدرسة","المدرسة","دولة المدرسة","الخدمات الإضافية","ملاحظات"]];
 view.forEach(r=>{A.push([r.ref,fmt(r.created_at),r.parent_name,r.phone,r.whatsapp,r.country,r.city,r.email,r.student_count,ST[r.status]||r.status,r.assigned_to,r.parent_notes,r.admin_note]);
  (r.students||[]).forEach(s=>B.push([r.ref,r.parent_name,s.name,s.age,s.dob,s.gender,s.country,s.city,s.service,s.program,s.level,s.curriculum,s.stage,s.grade,s.year,s.term,s.enrolled,s.school,s.school_country,(s.extras||[]).join("، "),s.note]))});return[A,B]}
function excel(){if(!view.length){alert("لا توجد طلبات للتصدير.");return}const[A,B]=sheets(),name=`fahm-registrations-${new Date().toISOString().slice(0,10)}`;
 if(window.XLSX){const wb=XLSX.utils.book_new();[["الطلبات",A],["الطلاب",B]].forEach(([n,d])=>{const ws=XLSX.utils.aoa_to_sheet(d);ws["!cols"]=d[0].map(()=>({wch:22}));XLSX.utils.book_append_sheet(wb,ws,n)});wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,name+".xlsx");return}
 const csv="\ufeff"+B.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=name+".csv";a.click();alert("تعذّر تحميل مكتبة Excel، فتم تنزيل ملف CSV يفتح في Excel.")}
function pdf(){if(!view.length){alert("لا توجد طلبات للتصدير.");return}
 $("#print").innerHTML=`<h1>طلبات التسجيل - منصة فهم التعليمية (${esc(new Date().toLocaleDateString("ar-EG"))})</h1><table><thead><tr><th>رقم الطلب</th><th>التاريخ</th><th>ولي الأمر</th><th>الهاتف</th><th>الطلاب</th><th>الحالة</th></tr></thead><tbody>${view.map(r=>`<tr><td dir="ltr">${esc(r.ref)}</td><td>${esc(fmt(r.created_at))}</td><td>${esc(r.parent_name)}</td><td dir="ltr">${esc(r.phone)}</td><td>${(r.students||[]).map(s=>esc(s.name)+" ("+esc(s.age)+" سنة، "+esc(svcOf(s))+(s.grade?"، "+esc(s.grade):"")+")").join("<br>")}</td><td>${esc(ST[r.status]||r.status)}</td></tr>`).join("")}</tbody></table>`;
 window.print()}

$("#lb").onclick=login;$("#pw").onkeydown=e=>{if(e.key==="Enter")login()};$("#out").onclick=logout;
["q","fs","fc","fg","d1","d2"].forEach(i=>$("#"+i).addEventListener("input",render));
$("#xl").onclick=excel;$("#pf").onclick=pdf;$("#rf").onclick=load;
$("#tb").onclick=e=>{const t=e.target.closest("tr.r");if(t)detail(+t.dataset.i)};
$("#md").onclick=e=>{const a=e.target.dataset.a;if(e.target.id==="md"||a==="close")$("#md").classList.add("hide");if(a==="save")save(e.target.dataset.id);if(a==="del")del(e.target.dataset.id)};
if(tok)load();
</script>
</body>
</html>
