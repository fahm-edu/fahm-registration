<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجّل أبناءك في منصة فهم التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#12399c;--blue2:#0b2a78;--gold:#f5b81c;--bg:#f4f7fd;--ink:#14213d;--mut:#5a6785;--line:#d9e1f2;--err:#c62828;--ok:#1b7f3b}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.hero{background:#fff;border-bottom:4px solid var(--gold)}
.hero img{display:block;width:100%;max-width:1100px;margin:0 auto;height:auto}
.intro{max-width:760px;margin:0 auto;padding:18px 16px 22px;text-align:center}
.intro h1{margin:0 0 6px;font-size:clamp(22px,5vw,32px);color:var(--blue);font-weight:800}
.intro p{margin:0;color:var(--mut);font-size:15px}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.prog{display:flex;gap:6px;margin:6px 0 4px}
.prog i{flex:1;height:8px;border-radius:6px;background:var(--line)}
.prog i.d{background:var(--blue)}.prog i.c{background:var(--gold)}
.pl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:12px}
.pl b{color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:19px;color:var(--blue)}
.who{background:#fff8e1;border:1px solid #f1d98a;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:700;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
label small{color:var(--mut);font-weight:400}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #f5b81c88;border-color:var(--blue)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:grid;grid-template-columns:150px 1fr;gap:8px;direction:rtl}
.ph input{direction:ltr;text-align:left}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.er{color:var(--err);font-size:13px;margin-top:3px;min-height:0}
.bad{border-color:var(--err)!important}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sv{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;font:inherit;font-weight:700;color:var(--ink)}
.sv span{display:block;font-size:30px}
.sv.on{border-color:var(--blue);background:#eaf0ff;box-shadow:0 0 0 3px var(--gold) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.gh{font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:12px 0}
.chk input{width:22px;height:22px;flex:none;margin-top:3px}
.bar{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;font:inherit;font-weight:800;font-size:17px;padding:14px;border-radius:14px;border:0;cursor:pointer}
.p{background:var(--blue);color:#fff}.p:hover{background:var(--blue2)}
.g{background:var(--gold);color:#3b2b00}
.s{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sum dt{color:var(--mut);font-size:13px}.sum dd{margin:0 0 6px;font-weight:600}
.sum{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.stu{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.stu h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.mini{font:inherit;font-size:13px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;cursor:pointer;margin-inline-start:4px}
.mini.x{color:var(--err);border-color:#f0b4b4}
.note{background:#eaf7ee;border:1px solid #9bd3ac;border-radius:12px;padding:12px;font-weight:600}
.warn{background:#fff8e1;border:1px solid #f1d98a;border-radius:12px;padding:12px;font-size:14px}
pre{white-space:pre-wrap;background:#f4f7fd;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;max-height:260px;overflow:auto}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=(t,n=120)=>String(t||"").replace(/[\u0000-\u001f\u007f<>]/g," ").replace(/\s+/g," ").trim().slice(0,n);
const P={name:"",dial:"+20",phone:"",same:true,wdial:"+20",wa:"",country:"مصر",city:"",email:"",notes:"",ok:false};
const newS=()=>({name:"",dob:"",gender:"",country:P.country,city:P.city,svc:"",opt:"",lvl:"",cur:"",stage:"",grade:"",year:"",term:"",school:"",schoolC:"",other:"",ex:[],subj:"",wk:"",tt:"",enote:""});

const cs=()=>S.st[S.i];
const svc=id=>CFG.svc.find(x=>x.id===id);

const words=t=>clean(t).split(" ").filter(Boolean).length;

function phoneFull(d,n){n=String(n||"").replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632).replace(/[\s\-()]/g,"");
 if(!/^\+?\d+$/.test(n))return null;
 let full=d?d+n.replace(/^\+/,"").replace(/^0+/,""):n; if(!d&&n[0]!=="+")return null;
 const dg=full.replace(/\D/g,"");return dg.length>=8&&dg.length<=15?dg:null}
const ageTxt=d=>{const a=age(d);return a===null||a<0||a>80?"يُحسب تلقائيًا":a<1?"أقل من سنة":a+" سنة"};
function age(dob){if(!dob)return null;const b=new Date(dob),t=new Date();let a=t.getFullYear()-b.getFullYear();const m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return a}

/* ========= التحقق ========= */
function v1(){const e={};
 if(words(P.name)<2)e.name="اكتب اسم ولي الأمر الكامل (اسمان على الأقل).";
 if(!phoneFull(P.dial,P.phone))e.phone="رقم الهاتف غير صحيح. اكتبه بدون مفتاح الدولة..";
 if(!P.same&&!phoneFull(P.wdial,P.wa))e.wa=P.wa.trim()?"رقم واتساب غير صحيح.":"أدخل رقم واتساب للتواصل، فهو إلزامي عند إلغاء «نفس رقم الهاتف».";
 if(!P.country)e.country="اختر الدولة المقيم فيها.";
 if(clean(P.city).length<2)e.city="اكتب المدينة.";
 if(!P.email.trim())e.email="البريد الإلكتروني إلزامي.";else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(P.email.trim()))e.email="صيغة البريد الإلكتروني غير صحيحة.";
 return e}
function v2(s){const e={},sv=svc(s.svc);
 if(!sv)e.svc="اختر الخدمة التعليمية.";
 else if(s.svc==="cur"){if(!s.cur)e.cur="اختر المنهج."}
 else{if(!s.opt)e.opt="اختر البرنامج المطلوب.";if(s.svc==="lang"&&!s.lvl)e.lvl="اختر المستوى."}
 return e}
function v3(s){const e={};
 if(words(s.name)<2)e.sname="اكتب اسم الطالب الكامل.";
 const a=age(s.dob);if(a===null||a<0||a>80)e.dob="أدخل تاريخ ميلاد صحيحًا.";
 if(!s.country)e.scountry="اختر الدولة المقيم فيها.";if(clean(s.city).length<2)e.scity="اكتب المدينة.";
 if(s.svc==="cur"){if(!s.stage)e.stage="اختر المرحلة.";if(!s.grade)e.grade="اختر الصف.";if(!s.year)e.year="اختر السنة الدراسية.";if(!s.term)e.term="اختر الفصل.";if(!s.other)e.other="اختر نعم أو لا.";if(s.other==="نعم"){if(clean(s.school).length<2)e.school="اكتب اسم المدرسة الحالية.";if(!s.schoolC)e.schoolC="اختر الدولة التي توجد فيها المدرسة."}}
 return e}
function v4(s){const e={};if(s.ex.includes("tut")){if(clean(s.subj).length<2)e.subj="اكتب المادة المطلوبة.";if(!s.wk)e.wk="اختر عدد الحصص.";if(!s.tt)e.tt="اختر نوع الحصص."}return e}

const ER=k=>S.err[k]?`<div class="er">${esc(S.err[k])}</div>`:"";

function prog(){const l=5-S.step;return `<div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="${S.step}">${T.map((_,i)=>`<i class="${i+1<S.step?"d":i+1===S.step?"c":""}"></i>`).join("")}</div>
<div class="pl"><span>الخطوة <b>${S.step}</b> من 5 — ${T[S.step-1]}</span><span>${l?`متبقي ${l} ${l===1?"خطوة":"خطوات"}`:"الخطوة الأخيرة"}</span></div>`}
const who=()=>S.st.length>1||S.step>1&&S.step<5?`<div class="who">الطالب ${S.i+1} من ${S.st.length}${cs().name?" — "+esc(cs().name):""}</div>`:"";
const inp=(lab,k,v,o={})=>`<label>${lab}<input data-k="${k}" value="${esc(v)}" type="${o.t||"text"}" ${o.ph?`placeholder="${o.ph}"`:""} ${o.m?`inputmode="${o.m}"`:""} maxlength="${o.max||100}" class="${bad(o.e||k)}"></label>${ER(o.e||k)}`;
const sel=(lab,k,v,list,o={})=>`<label>${lab}<select data-k="${k}" class="${bad(o.e||k)}"><option value="">اختر...</option>${list.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select></label>${ER(o.e||k)}`;
const chips=(k,v,list)=>`<div class="chips">${list.map(x=>`<button type="button" class="chip ${x===v?"on":""}" data-pick="${k}" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div>`;

function view(){let h=prog(),s=cs();

 if(S.step===2){const sv=svc(s.svc);
  h+=`${who()}<section class="card"><h2>اختر الخدمة التعليمية</h2><div class="cards">${CFG.svc.filter(x=>x.on).map(x=>`<button type="button" class="sv ${s.svc===x.id?"on":""}" data-svc="${x.id}"><span>${x.i}</span>${x.n}</button>`).join("")}</div>${ER("svc")}</section>`;

  h+=nav()}
 if(S.step===3){const c=CFG.cur.find(x=>x.n===s.cur),st=c&&c.st.find(x=>x.n===s.stage),a=age(s.dob);
  h+=`${who()}<section class="card"><h2>بيانات الطالب</h2>

  if(s.svc==="cur")h+=`<section class="card"><h2>المنهج الدراسي: ${esc(s.cur)}</h2>

 if(S.step===4){const t=s.ex.includes("tut");
  h+=`${who()}<section class="card"><h2>الخدمات الإضافية <small>(يمكن اختيار أكثر من خدمة)</small></h2><div class="chips">${CFG.extras.map(x=>`<button type="button" class="chip ${s.ex.includes(x[0])?"on":""}" data-ex="${x[0]}">${x[1]}</button>`).join("")}</div></section>
  ${t?`<section class="card"><h2>تفاصيل حصص التقوية</h2>${inp("المادة المطلوبة","s.subj",s.subj)}${sel("عدد الحصص أسبوعيًا","s.wk",s.wk,["1","2","3","4","5","6","7"],{e:"wk"})}<label>نوع الحصص</label>${chips("tt",s.tt,["فردية","جماعية"])}${ER("tt")}<label>ملاحظات ولي الأمر<textarea data-k="s.enote" rows="3" maxlength="300">${esc(s.enote)}</textarea></label></section>`:""}${nav("التالي: المراجعة")}`}
 if(S.step===5)h+=review();
 $("#app").innerHTML=h}
const nav=l=>`<div class="bar"><button class="btn s" data-go="back">السابق</button><button class="btn p" data-go="next">${l||"التالي"}</button></div>`;

function stuLine(s){const sv=svc(s.svc);return s.svc==="cur"?`${s.cur} — ${s.stage} — ${s.grade}`:`${sv.n} — ${s.opt}${s.lvl?" — "+s.lvl:""}`}
function exList(s){return s.ex.map(k=>{const n=CFG.extras.find(x=>x[0]===k)[1];return k==="tut"?`${n} (${clean(s.subj)}، ${s.wk} حصص أسبوعيًا، ${s.tt})`:n})}
function review(){return `<section class="card"><h2>بيانات ولي الأمر</h2><dl class="sum"><div><dt>الاسم</dt><dd>${esc(P.name)}</dd></div><div><dt>الهاتف</dt><dd dir="ltr" style="text-align:right">${esc(P.dial+P.phone)}</dd></div><div><dt>واتساب</dt><dd dir="ltr" style="text-align:right">${P.same?"نفس رقم الهاتف":esc(P.wdial+P.wa)}</dd></div><div><dt>الدولة المقيم فيها / المدينة</dt><dd>${esc(P.country)} / ${esc(P.city)}</dd></div></dl></section>
<section class="card"><h2>الطلاب (${S.st.length})</h2>${S.st.map((s,i)=>`<div class="stu"><h3><span>الطالب ${i+1}: ${esc(s.name)}</span><span><button class="mini" data-edit="${i}">تعديل</button>${S.st.length>1?`<button class="mini x" data-del="${i}">حذف</button>`:""}</span></h3>
<div>العمر: ${age(s.dob)} سنة${s.svc==="cur"?` — ${esc(s.year)} — ${esc(s.term)}`:""}</div>${s.other==="نعم"?`<div>المدرسة: ${esc(s.school)} (${esc(s.schoolC)})</div>`:""}<div>${esc(stuLine(s))}</div>${s.ex.length?`<div>الخدمات الإضافية: ${esc(exList(s).join("، "))}</div>`:""}</div>`).join("")}
<button class="btn s" data-go="add" style="width:100%">+ إضافة طالب آخر</button></section>
<section class="card"><label>ملاحظات ولي الأمر<textarea data-k="P.notes" rows="3" maxlength="400">${esc(P.notes)}</textarea></label>
<label class="chk"><input type="checkbox" data-k="P.ok" ${P.ok?"checked":""}> أقر بصحة البيانات المدخلة، وأوافق على التواصل معي من قسم التسجيل لاستكمال إجراءات التسجيل.</label>${ER("ok")}</section>
<div class="bar"><button class="btn s" data-go="edit">تعديل البيانات</button><button class="btn g" data-go="send" ${S.busy?"disabled":""}>إرسال طلب التسجيل عبر واتساب</button></div>`}

/* ========= رسالة واتساب ========= */
function ref(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `FAHM-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${Math.floor(1000+Math.random()*9000)}`}
const OR=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر"];
function msg(r){const L=["*طلب تسجيل جديد - منصة فهم التعليمية*","","رقم الطلب: "+r,"","*أولًا: بيانات ولي الأمر*","","اسم ولي الأمر: "+clean(P.name),"رقم الهاتف: "+dp(P.dial,P.phone),"رقم واتساب: "+(P.same?dp(P.dial,P.phone):dp(P.wdial,P.wa)),"الدولة المقيم فيها: "+P.country,"المدينة: "+clean(P.city)];
 L.push("البريد الإلكتروني: "+clean(P.email,80));
 L.push("","*ثانيًا: بيانات الطلاب*");
 S.st.forEach((s,i)=>{L.push("",`*الطالب ${OR[i]||i+1}:*`,"","اسم الطالب: "+clean(s.name),"العمر: "+age(s.dob)+" سنة","الخدمة المطلوبة: "+svc(s.svc).n);
  if(s.svc==="cur")L.push("المنهج: "+s.cur,"المرحلة: "+s.stage,"الصف: "+s.grade,"السنة الدراسية: "+s.year,"الفصل الدراسي: "+s.term,"مسجل في مدرسة: "+s.other,...(s.other==="نعم"?["اسم المدرسة الحالية: "+clean(s.school),"دولة المدرسة: "+s.schoolC]:[]));
  else L.push("البرنامج: "+s.opt+(s.lvl?" ("+s.lvl+")":""));
  L.push("","الخدمات الإضافية:");const x=exList(s);if(x.length)x.forEach(t=>L.push("- "+t));else L.push("- لا يوجد");
  if(clean(s.enote,300))L.push("ملاحظات: "+clean(s.enote,300))});
 L.push("","ملاحظات ولي الأمر:",clean(P.notes,400)||"لا يوجد","","حالة الطلب:","طلب جديد - بانتظار مراجعة قسم التسجيل.","","تم إرسال طلب التسجيل عبر نموذج منصة فهم التعليمية.","العلم يصنع الفرص.");
 return L.join("\n")}
const dp=(d,n)=>d+" "+clean(n,20).replace(/^\+/,"").replace(/^0+/,"");
const waUrl=m=>`https://wa.me/${CFG.wa}?text=${encodeURIComponent(m)}`;
function sentView(){const x=S.sent;return `<section class="card"><h2>تم تجهيز بيانات التسجيل</h2><div class="note">تم تجهيز بيانات التسجيل. يرجى إرسال الرسالة من خلال واتساب حتى يصل طلبكم إلى قسم التسجيل.</div>
<p>رقم الطلب المرجعي: <b dir="ltr">${esc(x.r)}</b><br>حالة الطلب: <b>بانتظار إرسال واتساب</b></p>
<div class="warn">فتح واتساب لا يعني إرسال الرسالة. اضغط زر الإرسال داخل واتساب لإتمام الطلب. إن لم يفتح واتساب، استخدم الزر أدناه أو انسخ الرسالة وأرسلها إلى +20 127 111 7716.</div>
<div class="bar" style="margin:12px 0"><a class="btn g" style="text-align:center;text-decoration:none" href="${esc(x.u)}" target="_blank" rel="noopener">فتح محادثة واتساب</a><button class="btn s" data-go="copy">نسخ الرسالة</button></div><p style="text-align:center;margin:0 0 10px"><a href="${esc(x.d)}">فتح عبر تطبيق واتساب مباشرة</a></p>
<pre>${esc(x.m)}</pre><button class="btn s" data-go="back5" style="width:100%;margin-top:10px">العودة لتعديل البيانات</button></section>`}

/* ========= التفاعل ========= */
function setv(k,v){const[o,f]=k.split(".");(o==="P"?P:cs())[f]=v}
function resetDeps(s,f){const m={svc:["opt","lvl","cur","stage","grade"],cur:["stage","grade"],stage:["grade"]};(m[f]||[]).forEach(x=>s[x]="")}
document.addEventListener("input",e=>{const k=e.target.dataset.k;if(!k||e.target.type==="checkbox")return;let v=e.target.value;
 if(e.target.tagName!=="SELECT"&&e.target.type!=="date")v=v.replace(/[<>]/g,"");setv(k,v);if(k==="s.dob"){const el=$("#age");if(el)el.value=ageTxt(v)}});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;const t=e.target;
 if(t.type==="checkbox")setv(k,t.checked);else{setv(k,t.value);const f=k.split(".")[1];if(k[0]==="s")resetDeps(cs(),f);if(k==="s.dob"||t.tagName==="SELECT")view()}
 if(t.type==="checkbox"&&k!=="P.ok"){S.err={};if(k==="P.same"&&!P.same)P.wdial=P.dial;view();if(k==="P.same"&&!P.same)document.querySelector('[data-k="P.wa"]')?.focus()}else if(k==="P.ok")S.err.ok=""});
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-go]");if(!b)return;const d=b.dataset,s=cs();
 if(d.svc){s.svc=d.svc;resetDeps(s,"svc");s.opt=s.lvl=s.cur="";view();return}
 if(d.pick){s[d.pick]=d.v;if(d.pick==="other"&&d.v==="لا"){s.school="";s.schoolC=""}resetDeps(s,d.pick);S.err={};view();return}
 if(d.ex){s.ex=s.ex.includes(d.ex)?s.ex.filter(x=>x!==d.ex):[...s.ex,d.ex];view();return}
 if(d.edit!==undefined){S.i=+d.edit;S.step=2;S.err={};view();scrollTo(0,0);return}
 if(d.del!==undefined){if(S.st.length>1&&confirm("حذف هذا الطالب من الطلب؟")){S.st.splice(+d.del,1);S.i=0;view()}return}
 const g=d.go;if(!g)return;
 if(g==="next"){const e2=[0,v1,()=>v2(s),()=>v3(s),()=>v4(s)][S.step]();S.err=e2;if(Object.keys(e2).length){view();document.querySelector(".er")?.scrollIntoView({block:"center"});return}if(S.step===1)S.st.forEach(x=>{if(!x.city)x.city=clean(P.city);if(!x.country)x.country=P.country});S.step++;view();scrollTo({top:document.querySelector("main").offsetTop-10});return}
 if(g==="back"){S.step--;S.err={};view();return}
 if(g==="edit"){S.step=1;S.err={};view();return}
 if(g==="add"){S.st.push(newS());S.i=S.st.length-1;S.step=2;S.err={};view();scrollTo(0,0);return}
 if(g==="back5"){S.sent=null;S.step=5;view();return}
 if(g==="copy"){navigator.clipboard?.writeText(S.sent.m).then(()=>{b.textContent="تم النسخ"},()=>{b.textContent="تعذّر النسخ"});return}
 if(g==="send"){if(S.busy)return;
  if(!P.ok){S.err={ok:"يجب الموافقة قبل إرسال الطلب."};view();document.querySelector(".er")?.scrollIntoView({block:"center"});return}
  for(let i=0;i<S.st.length;i++){const x=S.st[i],er=Object.keys({...v2(x),...v3(x),...v4(x)});if(er.length){S.i=i;S.step=3;S.err={...v2(x),...v3(x),...v4(x)};if(v2(x).svc||v2(x).cur||v2(x).opt||v2(x).lvl)S.step=2;view();return}}
  if(Object.keys(v1()).length){S.step=1;S.err=v1();view();return}
  S.busy=true;const r=ref(),m=msg(r),u=waUrl(m);S.sent={r,m,u,d:`whatsapp://send?phone=${CFG.wa}&text=${encodeURIComponent(m)}`};view();location.href=u;
  setTimeout(()=>{S.busy=false},4000)}});
view();
</script>
</body>
</html>
